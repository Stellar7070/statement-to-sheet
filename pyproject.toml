[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-to-sheet"
version = "1.0.0"
description = "Privacy-first bank statement to spreadsheet converter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.10.0",
  "ofxparse>=0.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
statement-to-sheet = "statement_to_sheet.extract:main"
statement-to-sheet-web = "statement_to_sheet.web:run"

[tool.setuptools.packages.find]
where = ["src"]
